[project]
name = "canary-simulation-engine"
version = "0.1.0"
description = "Deterministic scenario simulation for Canary Pact"
requires-python = ">=3.11"
dependencies = [
  "canary-company-twin",
  "canary-contracts",
  "networkx>=3.4",
  "pydantic>=2.10",
]

[tool.uv.sources]
canary-company-twin = { workspace = true }
canary-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/simulation_engine"]
