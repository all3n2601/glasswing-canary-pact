[project]
name = "canary-contracts"
version = "2.1.0"
description = "Pydantic contracts for Canary Pact schema v2.1.0"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contracts_py"]
