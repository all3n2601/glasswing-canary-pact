[project]
name = "canary-company-twin"
version = "0.1.0"
description = "Company digital twin and dependency graph for Canary Pact"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.4",
  "pydantic>=2.10",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_twin"]
