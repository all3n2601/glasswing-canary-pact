[project]
name = "canary-agent-orchestration"
version = "0.1.0"
description = "LangGraph orchestration for Canary Pact department assessments"
requires-python = ">=3.11"
dependencies = [
  "canary-company-twin",
  "canary-simulation-engine",
  "langgraph>=1.0",
]

[tool.uv.sources]
canary-company-twin = { workspace = true }
canary-simulation-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_orchestration"]
